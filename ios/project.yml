# XcodeGen spec. GitHub Actions turns this into an Xcode project and builds it (see .github/workflows).
name: Tunes
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
packages:
  YouTubeKit:
    url: https://github.com/alexeichhorn/YouTubeKit
    from: "0.4.10"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Tunes:
    type: application
    platform: iOS
    sources: [Tunes]
    dependencies:
      - package: YouTubeKit
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.tunes
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: Tunes/Info.plist
      properties:
        CFBundleDisplayName: Tunes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSPhotoLibraryAddUsageDescription: Tunes saves your Wrapped share cards to Photos.
        ITSAppUsesNonExemptEncryption: false
